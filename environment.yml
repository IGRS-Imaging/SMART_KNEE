name: landmark_5070
channels:
  - conda-forge
  - defaults

dependencies:
  # -------------------------
  # Core
  # -------------------------
  - python=3.11
  - pip
  - numpy
  - scipy
  - pandas
  - scikit-learn
  - matplotlib
  - networkx
  - tqdm

  # -------------------------
  # Dev / Jupyter
  # -------------------------
  - ipykernel
  - jupyterlab
  - notebook

  # -------------------------
  # System / build helpers
  # -------------------------
  - cmake
  - ninja
  - gcc_linux-64
  - gxx_linux-64

  # -------------------------
  # Pip (GPU stack handled here)
  # -------------------------
  - pip:
      # ---- PyTorch (Blackwell / RTX 5070) ----
      - --pre
      - torch
      - torchvision
      - torchaudio
      - --index-url https://download.pytorch.org/whl/nightly/cu128

      # ---- PyTorch Geometric ----
      - pyg-lib
      - torch-scatter
      - torch-sparse
      - torch-cluster
      - torch-spline-conv
      - torch-geometric
      - -f https://data.pyg.org/whl/nightly/torch-2.6.0+cu128.html

      # ---- Your project deps ----
      - egnn-pytorch==0.2.8
      - einops
      - plotly
      - plyfile
      - numba

